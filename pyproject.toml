[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvkk-rag-tr"
version = "0.1.0"
description = "Türk mevzuatı için kaynak atıflı RAG araştırma projesi"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
retrieval = ["sentence-transformers", "chromadb"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "gradio>=4.0"]

[tool.setuptools]
packages = [
  "eval",
  "eval.metrics",
  "src",
  "src.api",
  "src.chunking",
  "src.embeddings",
  "src.generation",
  "src.ingestion",
  "src.retrieval",
  "src.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
