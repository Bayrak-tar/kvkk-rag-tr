<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Demo ekran görüntüsü bekleniyor</title>
  <desc id="description">Yerel indeks ve Gradio demo çalıştırıldıktan sonra gerçek ekran görüntüsü buraya alınmalıdır.</desc>
  <rect width="960" height="440" rx="18" fill="#f3f6fb"/>
  <rect x="36" y="32" width="888" height="376" rx="14" fill="#ffffff" stroke="#d7dfeb" stroke-width="2"/>
  <rect x="36" y="32" width="888" height="52" rx="14" fill="#172033"/>
  <circle cx="66" cy="58" r="7" fill="#ef6a5b"/>
  <circle cx="90" cy="58" r="7" fill="#f5bd4f"/>
  <circle cx="114" cy="58" r="7" fill="#61c454"/>
  <text x="480" y="64" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="16">KVKK RAG Türkçe · yerel demo</text>
  <text x="86" y="140" fill="#172033" font-family="Arial,sans-serif" font-size="27" font-weight="700">Gerçek demo görüntüsü bekleniyor</text>
  <text x="86" y="181" fill="#536174" font-family="Arial,sans-serif" font-size="17">İlk çalıştırmada Gradio arayüzünü açıp ekran görüntüsünü bu dosyanın yerine ekleyin.</text>
  <rect x="86" y="218" width="788" height="74" rx="8" fill="#ffffff" stroke="#c7d1df" stroke-width="2"/>
  <text x="108" y="262" fill="#8793a3" font-family="Arial,sans-serif" font-size="17">Örnek soru: İlgili kişinin Kanun kapsamındaki hakları nelerdir?</text>
  <rect x="86" y="320" width="144" height="42" rx="8" fill="#276ef1"/>
  <text x="158" y="347" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Sor</text>
  <text x="874" y="388" text-anchor="end" fill="#8793a3" font-family="Arial,sans-serif" font-size="13">Placeholder — çalışan uygulamanın ekran görüntüsü değildir.</text>
</svg>
